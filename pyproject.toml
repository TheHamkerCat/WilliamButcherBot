[project]
name = "williambutcherbot"
version = "0.1.0"
description = "A Telegram Bot for group management and more."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp~=3.14.1",
    "aiofiles~=23.2.1",
    "ffmpeg-python~=0.2.0",
    "gTTS~=2.5.1",
    "dnspython==2.6.1",
    "future~=1.0.0",
    "googletrans~=4.0.0rc1",
    "motor~=3.6",
    "pillow~=12.2.0",
    "psutil~=5.9.8",
    "pykeyboard~=0.1.5",
    "python-arq~=6.0.7",
    "requests~=2.32.4",
    "search-engine-parser~=0.6.8",
    "speedtest-cli~=2.1.3",
    "TgCrypto~=1.2.5",
    "uvloop~=0.19.0",
    "yt-dlp~=2026.6.9",
    "bs4~=0.0.2",
    "python-dotenv~=1.2.2",
    "feedparser~=6.0.12",
    "pyromod~=3.1.6",
    "fuzzysearch~=0.7.3",
    "img2pdf~=0.5.1",
    "telegraph~=2.2.0",
    "pytz~=2024.1",
    "kurigram==2.2.12",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

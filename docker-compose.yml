services:
  wbb:
    build: .
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - XDG_CACHE_HOME=/tmp/.cache
    volumes:
      - ./sessions:/wbb/sessions
      - ./data:/data
      - type: bind
        source: ./config.env
        target: /wbb/config.env
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:mode=1777
